name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Validate plugin agent files
        run: uv run --no-project --with 'pyyaml==6.0.3' scripts/validate_agent_file.py
      - name: Validate plugin skill frontmatter
        run: uv run --no-project --with 'pyyaml==6.0.3' scripts/validate_skill_frontmatter.py
      - name: Validate marketplace and plugin manifests
        run: uv run --no-project scripts/validate_plugin_manifest.py
      - name: Run tests
        run: uv run --no-project --with 'pyyaml==6.0.3' --with 'pytest==9.1.1' -- pytest tests/ -q
